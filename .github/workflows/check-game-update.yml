name: Check Game Update

on:
  workflow_dispatch:
    inputs:
      game_type:
        description: '游戏版本类型'
        required: true
        default: 'stable'
        type: choice
        options:
          - ea
          - stable
      ea_password:
        description: 'EA版密码（仅EA版需要）'
        required: false
        type: string
      force_update:
        description: '强制更新（忽略版本缓存）'
        required: false
        default: false
        type: boolean
  schedule:
    - cron: '0 */6 * * *'

jobs:
  check_update:
    runs-on: ubuntu-latest
    outputs:
      has_update: ${{ steps.check.outputs.has_update }}
      version: ${{ steps.check.outputs.version }}
      upload_id: ${{ steps.check.outputs.upload_id }}
      build_id: ${{ steps.check.outputs.build_id }}
      game_type: ${{ steps.check.outputs.game_type }}
      android_upload_id: ${{ steps.check.outputs.android_upload_id }}
      android_build_id: ${{ steps.check.outputs.android_build_id }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests

      - name: Restore version cache
        id: cache
        uses: actions/cache@v4
        with:
          path: .version_cache
          key: game-version-cache-${{ github.event.inputs.game_type || 'stable' }}
          restore-keys: |
            game-version-cache-

      - name: Check for updates
        id: check
        env:
          GAME_TYPE: ${{ github.event.inputs.game_type || 'stable' }}
          FORCE_UPDATE: ${{ github.event.inputs.force_update || 'false' }}
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          EA_PASSWORD: ${{ github.event.inputs.ea_password }}
        run: |
          python << 'EOF'
          import os, json, requests
          STABLE_GAME_ID = "2151565"
          EA_GAME_ID = "2499529"
          UPLOADS_URL = "https://api.itch.io/games/{game_id}/uploads"
          API_KEY = os.environ.get("ITCH_API_KEY", "")
          EA_PASSWORD = os.environ.get("EA_PASSWORD", "")
          game_type = os.environ.get("GAME_TYPE", "stable")
          force_update = os.environ.get("FORCE_UPDATE", "false").lower() == "true"
          game_id = EA_GAME_ID if game_type == "ea" else STABLE_GAME_ID
          print(f"检查游戏更新: {game_type} (game_id: {game_id})")
          if force_update: print("⚠️ 强制更新模式已启用")
          if not API_KEY: print("⚠️ 警告: ITCH_API_KEY未设置")
          if game_type == "ea" and not EA_PASSWORD: print("❌ 错误: EA版需要提供密码"); exit(1)
          url = UPLOADS_URL.format(game_id=game_id)
          headers = {"Authorization": API_KEY} if API_KEY else {}
          params = {"password": EA_PASSWORD} if game_type == "ea" and EA_PASSWORD else {}
          response = requests.get(url, headers=headers, params=params); response.raise_for_status()
          data = response.json()
          html_upload = android_upload = None
          for upload in data.get("uploads", []):
              channel = upload.get("channel_name", "")
              if channel == "html": html_upload = upload
              elif channel == "android": android_upload = upload
          if not html_upload: print("未找到HTML channel"); exit(1)
          upload_id = html_upload.get("id")
          build_info = html_upload.get("build", {})
          build_id = build_info.get("id")
          version = build_info.get("user_version", str(build_info.get("version", "unknown")))
          print(f"HTML Upload ID: {upload_id}\nHTML Build ID: {build_id}\nVersion: {version}")
          android_upload_id = android_build_id = ""
          if android_upload:
              android_upload_id = str(android_upload.get("id", ""))
              android_build_info = android_upload.get("build", {})
              android_build_id = str(android_build_info.get("id", ""))
              print(f"Android Upload ID: {android_upload_id}\nAndroid Build ID: {android_build_id}")
          else: print("⚠️ 未找到Android channel")
          os.makedirs(".version_cache", exist_ok=True)
          version_file = f".version_cache/last_version_{game_type}.json"
          last_version = last_build_id = None
          if os.path.exists(version_file):
              try:
                  with open(version_file, "r") as f:
                      cached = json.load(f); last_version = cached.get("version"); last_build_id = cached.get("build_id")
                  print(f"上次缓存版本: {last_version} (build_id: {last_build_id})")
              except Exception as e: print(f"读取缓存失败: {e}")
          has_update = "false"
          if force_update: has_update = "true"; print("✅ 强制更新")
          elif last_build_id is None: has_update = "true"; print("✅ 首次运行，需要更新")
          elif str(build_id) != str(last_build_id): has_update = "true"; print(f"✅ 检测到新版本: {last_version} -> {version}")
          else: print(f"ℹ️ 版本未变化: {version}")
          with open(version_file, "w") as f: json.dump({"version": version, "build_id": build_id, "upload_id": upload_id}, f)
          print(f"版本信息已缓存到: {version_file}")
          with open(os.environ["GITHUB_OUTPUT"], "a") as f:
              for k, v in [("has_update", has_update), ("version", version), ("upload_id", upload_id), ("build_id", build_id), ("game_type", game_type), ("android_upload_id", android_upload_id), ("android_build_id", android_build_id)]:
                  f.write(f"{k}={v}\n")
          print(f"\n{'🚀 将执行更新' if has_update == 'true' else '⏭️ 跳过更新'}")
          EOF

      - name: Save version cache
        if: always()
        uses: actions/cache/save@v4
        with:
          path: .version_cache
          key: game-version-cache-${{ github.event.inputs.game_type || 'ea' }}-${{ github.run_id }}

  download_and_export:
    needs: check_update
    if: needs.check_update.outputs.has_update == 'true'
    runs-on: windows-latest
    env:
      VERSION: ${{ needs.check_update.outputs.version }}
      UPLOAD_ID: ${{ needs.check_update.outputs.upload_id }}
      BUILD_ID: ${{ needs.check_update.outputs.build_id }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests selenium webdriver-manager
      - name: Setup Chrome
        uses: browser-actions/setup-chrome@latest
      - name: Download HTML file
        shell: bash
        run: |
          python << 'EOF'
          import os, requests
          upload_id = os.environ["UPLOAD_ID"]; build_id = os.environ["BUILD_ID"]; version = os.environ["VERSION"]
          html_url = f"https://html-classic.itch.zone/html/{upload_id}-{build_id}/index.html"
          print(f"下载HTML: {html_url}")
          response = requests.get(html_url, stream=True); response.raise_for_status()
          os.makedirs("temp_update_files", exist_ok=True)
          html_path = f"temp_update_files/index{version}.html"
          with open(html_path, "wb") as f:
              for chunk in response.iter_content(chunk_size=8192): f.write(chunk)
          print(f"HTML已保存到: {html_path}")
          with open(os.environ["GITHUB_ENV"], "a") as f: f.write(f"HTML_PATH={os.path.abspath(html_path)}\n")
          EOF
      - name: Export story data
        shell: bash
        run: |
          python << 'EOF'
          import os, time
          from selenium import webdriver
          from selenium.webdriver.chrome.service import Service as ChromeService
          from webdriver_manager.chrome import ChromeDriverManager
          from selenium.webdriver.common.by import By
          from selenium.webdriver.support.ui import WebDriverWait
          from selenium.webdriver.support import expected_conditions as EC
          html_path = os.environ["HTML_PATH"]; version = os.environ["VERSION"]
          js_path = "story-export.js"
          if not os.path.exists(js_path): print(f"警告: {js_path} 不存在，跳过"); exit(0)
          options = webdriver.ChromeOptions()
          options.add_argument("--headless=new"); options.add_argument("--no-sandbox")
          options.add_argument("--disable-dev-shm-usage"); options.add_argument("--disable-gpu")
          download_dir = os.path.abspath(".")
          prefs = {"download.default_directory": download_dir, "download.prompt_for_download": False, "download.directory_upgrade": True, "safebrowsing.enabled": True}
          options.add_experimental_option("prefs", prefs)
          driver = None
          try:
              service = ChromeService(ChromeDriverManager().install())
              driver = webdriver.Chrome(service=service, options=options)
              driver.execute_cdp_cmd("Page.setDownloadBehavior", {"behavior": "allow", "downloadPath": download_dir})
              driver.get("file://" + html_path)
              WebDriverWait(driver, 10).until(EC.presence_of_element_located((By.TAG_NAME, "body")))
              print("页面已加载")
              with open(js_path, "r", encoding="utf-8") as f: js_code = f.read()
              print("执行导出脚本..."); driver.execute_script(js_code)
              zip_path = os.path.join(download_dir, "story_export.zip")
              timeout = 60; start_time = time.time()
              while not os.path.exists(zip_path):
                  time.sleep(1)
                  if time.time() - start_time > timeout: print("下载超时"); exit(1)
              print(f"导出完成: {zip_path}")
          except Exception as e: print(f"错误: {e}"); exit(1)
          finally:
              if driver: driver.quit()
          EOF
      - name: Upload HTML artifact
        uses: actions/upload-artifact@v4
        with:
          name: game-html-${{ env.VERSION }}
          path: temp_update_files/*.html
          if-no-files-found: warn
      - name: Upload story export artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: story-export-${{ env.VERSION }}
          path: story_export.zip
          if-no-files-found: warn

  inject_modloader:
    needs: [check_update, download_and_export]
    if: needs.check_update.outputs.has_update == 'true'
    runs-on: windows-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check_update.outputs.version }}
      PYTHONIOENCODING: utf-8
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Download HTML artifact
        uses: actions/download-artifact@v4
        with:
          name: game-html-${{ env.VERSION }}
          path: game-html
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Download ModLoader Package from release
        shell: bash
        run: |
          # Use this repository's modloader-* releases because upstream artifacts expire
          # and the upstream release can be older than the current ModLoader master branch.
          DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases" | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          for r in releases:
              if r['tag_name'].startswith('modloader-') and not r['draft']:
                  for a in r.get('assets', []):
                      if a['name'] == 'ModLoader.Package.zip':
                          print(a['browser_download_url'])
                          sys.exit(0)
          print('NOT_FOUND')
          ")
          if [ "$DOWNLOAD_URL" = "NOT_FOUND" ]; then
            echo "❌ No ModLoader Package release found. Run the 'Build ModLoader Package' workflow first."
            exit 1
          fi
          echo "Downloading from: $DOWNLOAD_URL"
          curl -sL -o ModLoader.Package.zip "$DOWNLOAD_URL"
          mkdir -p modloader-download
          unzip -o ModLoader.Package.zip -d modloader-download
          echo "ModLoader Package downloaded and extracted"
          ls modloader-download/ | head -10

      - name: Setup ModLoader Package
        shell: pwsh
        run: |
          Write-Host "=== Downloaded files in modloader-download (top level) ==="
          Get-ChildItem -Path "modloader-download" | ForEach-Object { Write-Host $_.Name }
          if (Test-Path "modloader-download/dist-insertTools") {
            Write-Host "dist-insertTools found directly in modloader-download"
            Write-Host "Renaming modloader-download to ml-package..."
            Rename-Item -Path "modloader-download" -NewName "ml-package"
          } else {
            Write-Host "ERROR: dist-insertTools not found in modloader-download"
            Get-ChildItem -Path "modloader-download" -Recurse | Select-Object -First 50 | ForEach-Object { Write-Host $_.FullName }
            exit 1
          }
          Write-Host "=== ml-package contents ==="
          Get-ChildItem -Path "ml-package" | ForEach-Object { Write-Host $_.Name }
          if (Test-Path "ml-package/dist-insertTools") { Write-Host "✓ dist-insertTools OK" } else { Write-Host "✗ dist-insertTools MISSING"; exit 1 }
          if (Test-Path "ml-package/dist-BeforeSC2") { Write-Host "✓ dist-BeforeSC2 OK" } else { Write-Host "✗ dist-BeforeSC2 MISSING"; exit 1 }

      - name: Checkout SugarCube-2
        uses: actions/checkout@v4
        with:
          repository: Lyoko-Jeremie/sugarcube-2_Vrelnir
          path: SC2
          ref: TS2
      - name: Build SugarCube-2
        working-directory: ${{ github.workspace }}/SC2
        run: |
          npm install
          node build.js -d -u -b 2
      - name: Copy SC2 format.js
        shell: bash
        run: |
          cp SC2/build/twine2/sugarcube-2/format.js ml-package/format.js
          echo "Copied format.js to ml-package/"
      - name: Get ModLoader version
        id: modloader_version
        shell: bash
        run: |
          UTILS_FILE="ml-package/dist-BeforeSC2/Utils.js"
          if [ -f "$UTILS_FILE" ]; then
            ML_VERSION=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" "$UTILS_FILE" | head -1)
          fi
          if [ -z "$ML_VERSION" ]; then ML_VERSION="unknown"; fi
          echo "ModLoader Version: $ML_VERSION"
          echo "MODLOADER_VERSION=$ML_VERSION" >> $GITHUB_ENV
      - name: Copy modList.json
        shell: bash
        run: cp modloader/modList.json ml-package/modList.json
      - name: Find and set HTML filename
        shell: bash
        run: |
          HTML_FILE=$(ls game-html/*.html | head -1)
          echo "HTML_FILE=$HTML_FILE" >> $GITHUB_ENV
          echo "Found HTML file: $HTML_FILE"
      - name: SC2 Replace
        shell: pwsh
        working-directory: ${{ github.workspace }}/ml-package
        run: |
          $htmlPath = "${{ github.workspace }}/${{ env.HTML_FILE }}"
          $formatPath = Get-ChildItem -Path "." -Filter "format.js" -Recurse | Select-Object -First 1
          if ($formatPath) { node "dist-insertTools/sc2ReplaceTool.js" $htmlPath $formatPath.FullName }
          else { Copy-Item $htmlPath "$htmlPath.sc2replace.html" }
      - name: Inject ModLoader
        shell: pwsh
        working-directory: ${{ github.workspace }}/ml-package
        run: |
          $htmlPath = "${{ github.workspace }}/${{ env.HTML_FILE }}.sc2replace.html"
          node "dist-insertTools/insert2html.js" $htmlPath "modList.json" "dist-BeforeSC2/BeforeSC2.js" ""
      - name: Inject ModLoader (polyfill)
        shell: pwsh
        working-directory: ${{ github.workspace }}/ml-package
        run: |
          $htmlPath = "${{ github.workspace }}/${{ env.HTML_FILE }}.sc2replace.html"
          $polyfillPath = "dist-BeforeSC2/polyfill.js"
          if (Test-Path $polyfillPath) { node "dist-insertTools/insert2html-polyfill.js" $htmlPath "modList.json" "dist-BeforeSC2/BeforeSC2.js" $polyfillPath "ManualPolyfill.js" }
          else { Write-Host "polyfill.js not found, skipping" }
      - name: Apply CoT specific patches
        shell: bash
        run: |
          MOD_HTML="${{ env.HTML_FILE }}.sc2replace.html.mod.html"
          POLYFILL_HTML="${{ env.HTML_FILE }}.sc2replace.html.mod-polyfill.html"
          if [ -f "$MOD_HTML" ]; then python modloader/replace.py "$MOD_HTML"; fi
          if [ -f "$POLYFILL_HTML" ]; then python modloader/replace.py "$POLYFILL_HTML"; fi
      - name: Prepare final output
        shell: bash
        run: |
          mkdir -p final-output
          MOD_HTML="${{ env.HTML_FILE }}.sc2replace.html.mod.html"
          POLYFILL_HTML="${{ env.HTML_FILE }}.sc2replace.html.mod-polyfill.html"
          GAME_VER="${VERSION}"; ML_VER="${MODLOADER_VERSION}"
          if [ -f "$MOD_HTML" ]; then cp "$MOD_HTML" "final-output/CourseOfTemptation-ModLoader-${GAME_VER}-${ML_VER}.html"; fi
          if [ -f "$POLYFILL_HTML" ]; then cp "$POLYFILL_HTML" "final-output/CourseOfTemptation-ModLoader-${GAME_VER}-${ML_VER}-polyfill.html"; fi
          ls -la final-output/
      - name: Upload ModLoader injected HTML
        uses: actions/upload-artifact@v4
        with:
          name: CourseOfTemptation-ModLoader-${{ env.VERSION }}-${{ env.MODLOADER_VERSION }}
          path: final-output/*.html
          if-no-files-found: warn

  build_android:
    needs: [check_update, inject_modloader]
    if: needs.check_update.outputs.has_update == 'true' && needs.check_update.outputs.android_upload_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check_update.outputs.version }}
      ANDROID_UPLOAD_ID: ${{ needs.check_update.outputs.android_upload_id }}
      ANDROID_BUILD_ID: ${{ needs.check_update.outputs.android_build_id }}
      GAME_TYPE: ${{ needs.check_update.outputs.game_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
          sudo apt-get update
          sudo apt-get install -y apktool zipalign apksigner
      - name: Download ModLoader HTML artifact
        uses: actions/download-artifact@v4
        with:
          pattern: CourseOfTemptation-ModLoader-*
          path: modloader-html
          merge-multiple: true
      - name: Get ModLoader version from artifact
        id: get_ml_version
        shell: bash
        run: |
          HTML_FILE=$(ls modloader-html/*.html | grep -v polyfill | head -1)
          if [ -n "$HTML_FILE" ]; then
            BASENAME=$(basename "$HTML_FILE" .html)
            ML_VER=$(echo "$BASENAME" | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
            echo "MODLOADER_VERSION=$ML_VER" >> $GITHUB_ENV
          else
            echo "MODLOADER_VERSION=unknown" >> $GITHUB_ENV
          fi
      - name: Download official Android APK
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          EA_PASSWORD: ${{ github.event.inputs.ea_password }}
        run: |
          python << 'EOF'
          import os, requests
          upload_id = os.environ["ANDROID_UPLOAD_ID"]; api_key = os.environ.get("ITCH_API_KEY", "")
          ea_password = os.environ.get("EA_PASSWORD", ""); game_type = os.environ.get("GAME_TYPE", "stable")
          download_url = f"https://api.itch.io/uploads/{upload_id}/download"
          headers = {"Authorization": api_key} if api_key else {}
          params = {"password": ea_password} if game_type == "ea" and ea_password else {}
          print(f"下载Android APK: {download_url}")
          response = requests.get(download_url, headers=headers, params=params, allow_redirects=True, stream=True); response.raise_for_status()
          os.makedirs("apk-download", exist_ok=True)
          with open("apk-download/original.apk", "wb") as f:
              for chunk in response.iter_content(chunk_size=8192): f.write(chunk)
          print(f"APK已下载: apk-download/original.apk ({os.path.getsize('apk-download/original.apk') / 1024 / 1024:.2f} MB)")
          EOF
      - name: Extract real APK from downloaded archive
        run: |
          file apk-download/original.apk
          mkdir -p apk-temp; unzip -o apk-download/original.apk -d apk-temp
          REAL_APK=$(find apk-temp -name "*.apk" -type f | head -1)
          if [ -z "$REAL_APK" ]; then echo "❌ 未找到APK文件"; exit 1; fi
          mv "$REAL_APK" apk-download/game.apk
          echo "REAL_APK_PATH=apk-download/game.apk" >> $GITHUB_ENV
      - name: Find HTML path in APK
        run: |
          HTML_PATH_IN_APK=$(unzip -l apk-download/game.apk | grep -oE "[^ ]+index\.html" | head -1)
          if [ -z "$HTML_PATH_IN_APK" ]; then HTML_PATH_IN_APK=$(unzip -l apk-download/game.apk | grep -oE "[^ ]+\.html" | head -1); fi
          if [ -z "$HTML_PATH_IN_APK" ]; then echo "❌ 未找到HTML文件"; exit 1; fi
          echo "HTML_PATH_IN_APK=$HTML_PATH_IN_APK" >> $GITHUB_ENV
      - name: Create modified APKs
        run: |
          MOD_HTML=$(ls modloader-html/*.html | grep -v polyfill | head -1)
          POLYFILL_HTML=$(ls modloader-html/*.html | grep polyfill | head -1)
          mkdir -p apk-output
          if [ -n "$MOD_HTML" ]; then
            cp apk-download/game.apk apk-output/mod.apk
            HTML_DIR=$(dirname "$HTML_PATH_IN_APK"); mkdir -p "temp-html/$HTML_DIR"
            cp "$MOD_HTML" "temp-html/$HTML_PATH_IN_APK"
            cd temp-html; zip -u ../apk-output/mod.apk "$HTML_PATH_IN_APK"; cd ..
            rm -rf temp-html; zip -d apk-output/mod.apk "META-INF/*" || true
          fi
          if [ -n "$POLYFILL_HTML" ]; then
            cp apk-download/game.apk apk-output/polyfill.apk
            HTML_DIR=$(dirname "$HTML_PATH_IN_APK"); mkdir -p "temp-html/$HTML_DIR"
            cp "$POLYFILL_HTML" "temp-html/$HTML_PATH_IN_APK"
            cd temp-html; zip -u ../apk-output/polyfill.apk "$HTML_PATH_IN_APK"; cd ..
            rm -rf temp-html; zip -d apk-output/polyfill.apk "META-INF/*" || true
          fi
      - name: Setup signing keystore
        run: echo "${{ secrets.APK_KEYSTORE_BASE64 }}" | base64 -d > signing.keystore
      - name: Sign APKs
        run: |
          mkdir -p apk-signed
          if [ -f "apk-output/mod.apk" ]; then
            zipalign -v 4 apk-output/mod.apk apk-output/aligned-mod.apk
            apksigner sign --ks signing.keystore --ks-pass "pass:${{ secrets.APK_KEYSTORE_PASSWORD }}" --ks-key-alias "${{ secrets.APK_KEY_ALIAS }}" --key-pass "pass:${{ secrets.APK_KEY_PASSWORD }}" --out "apk-signed/CoT-ModLoader-${VERSION}-${MODLOADER_VERSION}.apk" apk-output/aligned-mod.apk
          fi
          if [ -f "apk-output/polyfill.apk" ]; then
            zipalign -v 4 apk-output/polyfill.apk apk-output/aligned-polyfill.apk
            apksigner sign --ks signing.keystore --ks-pass "pass:${{ secrets.APK_KEYSTORE_PASSWORD }}" --ks-key-alias "${{ secrets.APK_KEY_ALIAS }}" --key-pass "pass:${{ secrets.APK_KEY_PASSWORD }}" --out "apk-signed/CoT-ModLoader-${VERSION}-${MODLOADER_VERSION}-polyfill.apk" apk-output/aligned-polyfill.apk
          fi
          ls -la apk-signed/
      - name: Upload Android APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: CoT-Android-ModLoader-${{ env.VERSION }}-${{ env.MODLOADER_VERSION }}
          path: apk-signed/*.apk
          if-no-files-found: error

  build_image_pack:
    needs: [check_update]
    if: needs.check_update.outputs.has_update == 'true' && needs.check_update.outputs.android_upload_id != ''
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check_update.outputs.version }}
      ANDROID_UPLOAD_ID: ${{ needs.check_update.outputs.android_upload_id }}
      ANDROID_BUILD_ID: ${{ needs.check_update.outputs.android_build_id }}
      GAME_TYPE: ${{ needs.check_update.outputs.game_type }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x
      - name: Enable Corepack
        run: corepack enable
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install requests
      - name: Download official Android APK
        env:
          ITCH_API_KEY: ${{ secrets.ITCH_API_KEY }}
          EA_PASSWORD: ${{ github.event.inputs.ea_password }}
        run: |
          python << 'EOF'
          import os, requests
          upload_id = os.environ["ANDROID_UPLOAD_ID"]; api_key = os.environ.get("ITCH_API_KEY", "")
          ea_password = os.environ.get("EA_PASSWORD", ""); game_type = os.environ.get("GAME_TYPE", "stable")
          download_url = f"https://api.itch.io/uploads/{upload_id}/download"
          headers = {"Authorization": api_key} if api_key else {}
          params = {"password": ea_password} if game_type == "ea" and ea_password else {}
          print(f"下载Android APK: {download_url}")
          response = requests.get(download_url, headers=headers, params=params, allow_redirects=True, stream=True); response.raise_for_status()
          os.makedirs("apk-download", exist_ok=True)
          with open("apk-download/original.apk", "wb") as f:
              for chunk in response.iter_content(chunk_size=8192): f.write(chunk)
          print(f"APK已下载 ({os.path.getsize('apk-download/original.apk') / 1024 / 1024:.2f} MB)")
          EOF
      - name: Extract APK and get res directory
        run: |
          file apk-download/original.apk
          mkdir -p apk-temp; unzip -o apk-download/original.apk -d apk-temp
          REAL_APK=$(find apk-temp -name "*.apk" -type f | head -1)
          if [ -z "$REAL_APK" ]; then echo "❌ 未找到APK文件"; exit 1; fi
          mkdir -p apk-contents; unzip -o "$REAL_APK" -d apk-contents
          RES_DIR=$(find apk-contents -type d -name "res" -path "*assets*" | head -1)
          if [ -z "$RES_DIR" ]; then RES_DIR=$(find apk-contents -type d -path "*/www/res" | head -1); fi
          if [ -z "$RES_DIR" ]; then echo "❌ 未找到res目录"; exit 1; fi
          mkdir -p game-res; cp -r "$RES_DIR" game-res/
          echo "总图片文件数: $(find game-res -type f \( -name '*.png' -o -name '*.jpg' -o -name '*.gif' -o -name '*.webp' \) | wc -l)"

      - name: Download ModLoader Package from release
        shell: bash
        run: |
          # Use this repository's modloader-* releases because upstream artifacts expire
          # and the upstream release can be older than the current ModLoader master branch.
          DOWNLOAD_URL=$(curl -s "https://api.github.com/repos/${{ github.repository }}/releases" | python3 -c "
          import json, sys
          releases = json.load(sys.stdin)
          for r in releases:
              if r['tag_name'].startswith('modloader-') and not r['draft']:
                  for a in r.get('assets', []):
                      if a['name'] == 'ModLoader.Package.zip':
                          print(a['browser_download_url'])
                          sys.exit(0)
          print('NOT_FOUND')
          ")
          if [ "$DOWNLOAD_URL" = "NOT_FOUND" ]; then
            echo "❌ No ModLoader Package release found. Run the 'Build ModLoader Package' workflow first."
            exit 1
          fi
          echo "Downloading from: $DOWNLOAD_URL"
          curl -sL -o ModLoader.Package.zip "$DOWNLOAD_URL"
          mkdir -p ModLoader
          unzip -o ModLoader.Package.zip -d ModLoader
          echo "ModLoader Package downloaded and extracted"
          ls ModLoader/ | head -10

      - name: Verify ModLoader structure
        run: |
          if [ ! -d "ModLoader/dist-insertTools" ]; then echo "ERROR: dist-insertTools not found"; exit 1; fi
          echo "✓ ModLoader structure OK"
      - name: Checkout GameOriginalImagePackMod
        uses: actions/checkout@v4
        with:
          repository: Lyoko-Jeremie/GameOriginalImagePackMod
          path: ModLoader/mod/GameOriginalImagePack
          ref: master
      - name: Build GameOriginalImagePack
        working-directory: ${{ github.workspace }}/ModLoader/mod/GameOriginalImagePack
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          yarn run build:tools
      - name: Copy res to GameOriginalImagePack
        run: cp -r game-res/res ModLoader/mod/GameOriginalImagePack/
      - name: Generate boot.json for CoT
        working-directory: ${{ github.workspace }}/ModLoader/mod/GameOriginalImagePack
        run: |
          python "${{ github.workspace }}/scripts/generate_image_pack_boot.py" "res" "$VERSION" "boot.json" --extras
          head -50 boot.json
      - name: Pack mod zip
        working-directory: ${{ github.workspace }}/ModLoader/mod/GameOriginalImagePack
        run: node "${{ github.workspace }}/ModLoader/dist-insertTools/packModZip.js" "boot.json"
      - name: Prepare output
        run: |
          mkdir -p image-pack-output
          MOD_FILE=$(find ModLoader/mod/GameOriginalImagePack -name "*.mod.zip" -type f | head -1)
          if [ -z "$MOD_FILE" ]; then MOD_FILE=$(find ModLoader/mod/GameOriginalImagePack -name "*.zip" -type f | head -1); fi
          if [ -n "$MOD_FILE" ]; then cp "$MOD_FILE" "image-pack-output/GameOriginalImagePack-${VERSION}.mod.zip"; else echo "❌ No mod zip"; exit 1; fi
      - name: Upload GameOriginalImagePack artifact
        uses: actions/upload-artifact@v4
        with:
          name: GameOriginalImagePack-${{ env.VERSION }}
          path: image-pack-output/*.mod.zip
          if-no-files-found: error

  release_all:
    needs: [check_update, inject_modloader, build_android, build_image_pack]
    if: always() && needs.check_update.outputs.has_update == 'true'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      VERSION: ${{ needs.check_update.outputs.version }}
    steps:
      - name: Download all artifacts
        uses: actions/download-artifact@v4
        with:
          path: all-artifacts
          merge-multiple: false
      - name: Download ModI18N from build-i18n workflow
        uses: dawidd6/action-download-artifact@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          repo: ${{ github.repository }}
          workflow: build-i18n.yml
          workflow_conclusion: success
          name_is_regexp: true
          name: ModI18N-.*
          path: i18n-artifact
          search_artifacts: true
        continue-on-error: true
      - name: Prepare release files
        run: |
          mkdir -p release-files html-temp
          find all-artifacts -name "*.html" -exec cp {} html-temp/ \;
          HTML_FILE=$(ls html-temp/*.html 2>/dev/null | grep -v polyfill | head -1)
          POLYFILL_FILE=$(ls html-temp/*.html 2>/dev/null | grep polyfill | head -1)
          if [ -n "$HTML_FILE" ]; then
            ML_VER=$(basename "$HTML_FILE" .html | grep -oE '[0-9]+\.[0-9]+\.[0-9]+' | tail -1)
            echo "MODLOADER_VERSION=$ML_VER" >> $GITHUB_ENV
          else
            ML_VER="unknown"; echo "MODLOADER_VERSION=unknown" >> $GITHUB_ENV
          fi
          GAME_VER="${VERSION}"; [[ "$GAME_VER" != v* ]] && GAME_VER="v${GAME_VER}"
          if [ -n "$HTML_FILE" ]; then cd html-temp; zip "../release-files/CoT-ModLoader-${GAME_VER}-v${ML_VER}.zip" "$(basename "$HTML_FILE")"; cd ..; fi
          if [ -n "$POLYFILL_FILE" ]; then cd html-temp; zip "../release-files/CoT-ModLoader-${GAME_VER}-v${ML_VER}-polyfill.zip" "$(basename "$POLYFILL_FILE")"; cd ..; fi
          find all-artifacts -name "*.apk" -exec cp {} release-files/ \;
          find all-artifacts -name "*.mod.zip" -exec cp {} release-files/ \;
          if [ -d "i18n-artifact" ]; then find i18n-artifact -name "*.mod.zip" -exec cp {} release-files/ \;; fi
          ls -la release-files/
      - name: Get current date
        id: date
        run: echo "date=$(date +'%Y%m%d')" >> $GITHUB_OUTPUT
      - name: Create unified release
        uses: softprops/action-gh-release@v1
        with:
          files: release-files/*
          name: CoT ModLoader ${{ env.VERSION }}
          tag_name: ${{ env.VERSION }}
          body: |
            ## Course of Temptation ModLoader Release

            **Game Version:** ${{ env.VERSION }}
            **ModLoader Version:** ${{ env.MODLOADER_VERSION }}
            **Build Date:** ${{ steps.date.outputs.date }}

            ### 📦 包含内容

            #### HTML 版本
            - `CoT-ModLoader-v*-v*.zip` - 标准版 HTML
            - `CoT-ModLoader-v*-v*-polyfill.zip` - 兼容版 HTML（适用于旧浏览器）

            #### Android APK
            - `CoT-ModLoader-*.apk` - 标准版 APK
            - `CoT-ModLoader-*-polyfill.apk` - 兼容版 APK

            ⚠️ APK 使用 debug 签名，可能需要先卸载原版应用再安装

            #### 原版图包
            - `GameOriginalImagePack-*.mod.zip` - 原版游戏图片包

            需要 ModLoader DoL ImageLoaderHook 才能使用图片包

            #### 汉化包
            - `ModI18N-*.mod.zip` - 中文汉化包（如果可用）
          prerelease: true
