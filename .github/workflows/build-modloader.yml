name: Build ModLoader Package

on:
  workflow_dispatch:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        default: 'master'
  workflow_call:
    inputs:
      ref:
        description: 'Git ref to build (branch/tag/sha)'
        required: false
        type: string
        default: 'master'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout ModLoader source
        uses: actions/checkout@v4
        with:
          repository: Lyoko-Jeremie/sugarcube-2-ModLoader
          ref: ${{ inputs.ref || 'master' }}
          submodules: recursive

      - name: Use Node.js 18.x
        uses: actions/setup-node@v4
        with:
          node-version: 18.x

      - name: Enable Corepack
        run: corepack enable

      - name: Build ModLoader Core
        run: |
          yarn install
          yarn run ts:BeforeSC2
          yarn run webpack:BeforeSC2
          yarn run webpack:BeforeSC2-comp
          yarn run ts:ForSC2
          yarn run webpack:insertTools
          yarn run tras:babel

      # ModLoaderGui needs ModSubUiAngularJs types, so build it first
      - name: Build ModSubUiAngularJs
        working-directory: mod/ModSubUiAngularJs
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ModLoaderGui
        working-directory: mod/ModLoaderGui
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ImageLoaderHook
        working-directory: mod/ImageLoaderHook
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          yarn run build-core:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot-core.json"

      - name: Build ReplacePatch
        working-directory: mod/ReplacePatch
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      # TweeReplacerLinker must build before TweeReplacer and I18nTweeReplacer
      - name: Build TweeReplacerLinker
        working-directory: mod/TweeReplacerLinker
        run: |
          yarn install
          yarn run ts:type
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build TweeReplacer
        working-directory: mod/TweeReplacer
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build I18nTweeReplacer
        working-directory: mod/I18nTweeReplacer
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build CheckDoLCompressorDictionaries
        working-directory: mod/CheckDoLCompressorDictionaries
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build CheckGameVersion
        working-directory: mod/CheckGameVersion
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build CheckGameVersionCot
        working-directory: mod/CheckGameVersionCot
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build Diff3WayMerge
        working-directory: mod/Diff3WayMerge
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build DoLTimeWrapperAddon
        working-directory: mod/DoLTimeWrapperAddon
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ModdedClothesAddon
        working-directory: mod/ModdedClothesAddon
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ModdedFeatsAddon
        working-directory: mod/ModdedFeatsAddon
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ModdedHairAddon
        working-directory: mod/ModdedHairAddon
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ConflictChecker
        working-directory: mod/ConflictChecker
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build I18nTweeList
        working-directory: mod/I18nTweeList
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build I18nScriptList
        working-directory: mod/I18nScriptList
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build TweePrefixPostfixAddon
        working-directory: mod/TweePrefixPostfixAddon
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build SweetAlert2Mod
        working-directory: mod/SweetAlert2Mod
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ModuleCssReplacer
        working-directory: mod/ModuleCssReplacer
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build BeautySelectorAddon
        working-directory: mod/BeautySelectorAddon
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build DoLHookWidget
        working-directory: mod/DoLHookWidget
        run: |
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build DoLLinkButtonFilter
        working-directory: mod/DoLLinkButtonFilter
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build HookMacroRng
        working-directory: mod/HookMacroRng
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Build ImageLoaderHook2BeautySelectorAddon
        working-directory: mod/ImageLoaderHook2BeautySelectorAddon
        run: |
          yarn install
          yarn run build:ts
          yarn run build:webpack
          node "${{ github.workspace }}/dist-insertTools/packModZip.js" "boot.json"

      - name: Assemble package
        run: |
          mkdir -p out

          # Copy core dist directories
          cp -r dist-BeforeSC2 out/
          cp -r dist-BeforeSC2-comp out/
          cp -r dist-BeforeSC2-comp-babel out/
          cp -r dist-ForSC2 out/
          cp -r dist-insertTools out/
          cp -f ManualPolyfill.js out/ 2>/dev/null || true
          cp -f README.md out/ 2>/dev/null || true
          cp -f modList.json out/ 2>/dev/null || true

          # Copy mod zips preserving directory structure
          # modList.json references paths like "mod/ModLoaderGui/ModLoaderGui.mod.zip"
          # so we must keep the mod/ directory hierarchy
          find mod -name "*.mod.zip" | while read modzip; do
            dest_dir="out/$(dirname "$modzip")"
            mkdir -p "$dest_dir"
            cp "$modzip" "$dest_dir/"
          done

          # Copy mod dist-for-type directories
          for moddir in mod/*/; do
            modname=$(basename "$moddir")
            if [ -d "$moddir/dist" ]; then
              mkdir -p "out/mod-dist/$modname/dist"
              cp -r "$moddir/dist/"* "out/mod-dist/$modname/dist/"
            fi
            if [ -d "$moddir/dist-ts" ]; then
              mkdir -p "out/mod-dist/$modname/dist-ts"
              cp -r "$moddir/dist-ts/"* "out/mod-dist/$modname/dist-ts/"
            fi
            if [ -d "$moddir/dist-tools" ]; then
              mkdir -p "out/mod-dist/$modname/dist-tools"
              cp -r "$moddir/dist-tools/"* "out/mod-dist/$modname/dist-tools/"
            fi
            if [ -d "$moddir/dist-tool" ]; then
              mkdir -p "out/mod-dist/$modname/dist-tool"
              cp -r "$moddir/dist-tool/"* "out/mod-dist/$modname/dist-tool/"
            fi
          done

          echo "=== Package contents ==="
          find out -maxdepth 3 -type f -name "*.mod.zip"
          echo "---"
          find out -maxdepth 2 -type f | head -20
          echo "..."
          echo "Total files: $(find out -type f | wc -l)"

      - name: Get ModLoader version
        id: version
        run: |
          UTILS_FILE="dist-BeforeSC2/Utils.js"
          ML_VERSION="unknown"
          if [ -f "$UTILS_FILE" ]; then
            ML_VERSION=$(grep -oE "[0-9]+\.[0-9]+\.[0-9]+" "$UTILS_FILE" | head -1)
          fi
          echo "version=$ML_VERSION" >> $GITHUB_OUTPUT
          echo "ModLoader Version: $ML_VERSION"

      - name: Create zip
        run: |
          cd out
          zip -r ../ModLoader.Package.zip .

      - name: Delete old modloader releases
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Delete previous modloader-* releases to keep only the latest
          # Must use -R to target own repo since checkout is upstream
          gh release list -R "${{ github.repository }}" --limit 50 --json tagName -q '.[].tagName' | grep '^modloader-' | while read tag; do
            echo "Deleting old release: $tag"
            gh release delete "$tag" -R "${{ github.repository }}" -y --cleanup-tag || true
          done

      - name: Create release
        uses: softprops/action-gh-release@v1
        with:
          tag_name: modloader-${{ steps.version.outputs.version }}
          name: ModLoader Package ${{ steps.version.outputs.version }}
          body: |
            Built from [Lyoko-Jeremie/sugarcube-2-ModLoader](https://github.com/Lyoko-Jeremie/sugarcube-2-ModLoader) @ `${{ inputs.ref || 'master' }}`

            ModLoader Version: ${{ steps.version.outputs.version }}
          files: ModLoader.Package.zip
          prerelease: true
